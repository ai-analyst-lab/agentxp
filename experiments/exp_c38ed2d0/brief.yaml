schema_version: 1
hypothesis: Relocating Buy Now above the fold raises conversion_rate.
primary_metric: conversion_rate
primary_metric_type: proportion
primary_decision_rule: |
  Ship if ci_low > 0 on Δconversion_rate AND no guardrail breaches NIM.
mde_text: 5.0% relative
mde_pct: 5.0
baseline: 0.10
n_required: 115518
guardrails:
  - metric_name: revenue_per_user
    direction: higher_is_better
    nim_relative: -0.01
cohorts_summary:
  - all assigned users in the window
cohorts:
  - name: all_assigned
    definition: users assigned to the experiment in the window
assignment_unit: user_id
arms:
  - control
  - treatment
expected_arm_ratio_text: 50/50
primary_direction: higher_is_better
late_ratio: null
